<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t d">
  <title id="t">Example snap layouts</title>
  <desc id="d">Small screen diagrams showing a window filling a half, a quarter, a third, two thirds, a sixth and a ninth of the screen, plus a wide screen split into thirds and a tiled grid.</desc>
  <style>
    .s{fill:none;stroke:#8a8f98;stroke-width:2}
    .w{fill:#0a5bd8}
    .g{stroke:#8a8f98;stroke-width:1;stroke-dasharray:3 3}
    text{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52575f;text-anchor:middle}
    @media (prefers-color-scheme:dark){.w{fill:#6aa6ff}text{fill:#a9aeb7}}
  </style>
  <g transform="translate(10,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="4" y="4" width="39" height="54" rx="3"/><text x="45" y="92">Half</text></g>
  <g transform="translate(115,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="47" y="4" width="39" height="26" rx="3"/><text x="45" y="92">Quarter</text></g>
  <g transform="translate(220,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="32" y="4" width="26" height="54" rx="3"/><text x="45" y="92">Third</text></g>
  <g transform="translate(325,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="4" y="4" width="55" height="54" rx="3"/><text x="45" y="92">Two thirds</text></g>
  <g transform="translate(430,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="32" y="4" width="26" height="26" rx="3"/><text x="45" y="92">Sixth</text></g>
  <g transform="translate(535,10)"><rect class="s" width="90" height="62" rx="6"/><rect class="w" x="32" y="22" width="26" height="18" rx="3"/><text x="45" y="92">Ninth</text></g>
  <g transform="translate(10,120)"><rect class="s" width="300" height="86" rx="8"/><line class="g" x1="100" y1="4" x2="100" y2="82"/><line class="g" x1="200" y1="4" x2="200" y2="82"/><rect class="w" x="104" y="6" width="92" height="74" rx="4"/><text x="150" y="108" dy="12">Center third</text></g>
  <g transform="translate(330,120)"><rect class="s" width="300" height="86" rx="8"/><rect class="w" x="6" y="6" width="90" height="35" rx="4"/><rect class="w" x="104" y="6" width="90" height="35" rx="4" opacity=".55"/><rect class="w" x="202" y="45" width="92" height="35" rx="4" opacity=".8"/><rect class="w" x="6" y="45" width="90" height="35" rx="4" opacity=".4"/><text x="150" y="108" dy="12">Tiled grid</text></g>
</svg>
