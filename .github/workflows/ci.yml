name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: command -v swiftlint >/dev/null || brew install swiftlint; swiftlint lint
      - run: swift build
      - run: swift test --parallel
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Public values (repository variables, not secrets). Unset -> package.sh builds with updates disabled.
          SU_FEED_URL: ${{ vars.SU_FEED_URL }}
          SU_PUBLIC_ED_KEY: ${{ vars.SU_PUBLIC_ED_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.dmg }
permissions:
  contents: write
