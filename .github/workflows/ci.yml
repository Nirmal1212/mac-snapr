name: CI
on:
  push: { branches: [main, develop], tags: ['v*'] }
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: command -v swiftlint >/dev/null || brew install swiftlint; swiftlint lint
      - run: swift build
      - run: swift test --parallel

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        env:
          # Public values (repository variables, not secrets). Unset -> package.sh builds with updates disabled.
          SU_FEED_URL: ${{ vars.SU_FEED_URL }}
          SU_PUBLIC_ED_KEY: ${{ vars.SU_PUBLIC_ED_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh
      - name: Release
        # Pinned to the commit behind tag v2 (verified with git ls-remote on 2026-11-05).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: dist/*.dmg }
