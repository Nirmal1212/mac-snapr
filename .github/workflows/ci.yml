name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: command -v swiftlint >/dev/null || brew install swiftlint; swiftlint lint
      - run: swift build
      - run: swift test --parallel
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.dmg }
permissions:
  contents: write
