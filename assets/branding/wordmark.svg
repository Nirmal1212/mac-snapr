<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <!-- Lockup: mark + "Snapr". The text is live text using a system font stack (not outlined);
       outline it in a vector editor if pixel-identical rendering everywhere is required. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C5BE8"/><stop offset="1" stop-color="#1E2380"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD54A"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DDFB"/></linearGradient>
  </defs>
  <g transform="translate(10 10) scale(0.2306) translate(-100 -100)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="232" y="232" width="266" height="560" rx="46" fill="url(#pane)"/>
    <rect x="526" y="526" width="266" height="266" rx="46" fill="url(#pane)"/>
    <rect x="526" y="232" width="266" height="266" rx="46" fill="url(#accent)"/>
  </g>
  <text x="228" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="116" font-weight="700" letter-spacing="-3" fill="#1E2380">Snapr</text>
</svg>
